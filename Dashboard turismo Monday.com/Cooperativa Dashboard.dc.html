  // son campos operativos que la cooperativa captura por salida.
  // Los comedores se extraen del itinerario y se liquidan DIRECTO al comedor.
  derivarComedores(days){
    const out=[];
    (days||[]).forEach(day=>{
      day.items.forEach(it=>{
        // 'Comida: Restaurante Marlen', 'Comida · Cena', 'Box lunch – Karla', 'Desayuno'
        it.split('·').forEach(part=>{
          const m=part.trim().match(/^(Desayuno|Comida|Cena|Box lunch)\b\s*[:–-]?\s*(.*)$/i);
          if(!m) return;
          const tipo=m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase();
          out.push({dia:day.n, com:day.com, tipo:tipo==='Box lunch'?'Box lunch':tipo,
                    nombre:(m[2]||'').trim()||'Por definir', monto:0, liquidado:false});
        });
      });
    });
    return out;
  }

  // ---------- helpers de reservas ----------
  pkgOf(id){ return this.state.packages.find(p=>p.id===id); }
  pkgReservas(pkgId){ return this.state.reservas.filter(r=>r.pkgId===pkgId); }
  pkgPersonas(pkgId){ return this.pkgReservas(pkgId).reduce((a,r)=>a+(r.personas||0),0); }
  pkgNinos(pkgId){ return this.pkgReservas(pkgId).reduce((a,r)=>a+(r.ninos?(r.numNinos||0):0),0); }
  pkgPaid(pkgId){ const rs=this.pkgReservas(pkgId); if(!rs.length)return 0; return Math.round(rs.reduce((a,r)=>a+(r.paid||0),0)/rs.length); }
  nextCodigo(){ const n=this.state.reservas.length+1; return 'ESN-2607-'+String(n).padStart(3,'0'); }

  // ---------- helpers ----------
  money(n){ return '$'+Number(n).toLocaleString('en-US'); }
  initials(name){ const p=name.trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase(); }
  avColor(name){ let s=0; for(let i=0;i<name.length;i++) s+=name.charCodeAt(i); return this.AVCOL[s%this.AVCOL.length]; }
  toast(msg, tone){ this.setState({toast:{msg,tone:tone||'ok',t:Date.now()}}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:null}),2600); }
  paidColor(p){ return p<50?'#DC2626':p<80?'#FBBF24':'#16A34A'; }

  avatar(name, size){
    const h=this.h, s=size||26;
    return h('div',{title:name, style:{width:s,height:s,borderRadius:'50%',background:this.avColor(name),color:'#fff',fontSize:s*0.4,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flex:'0 0 auto',boxShadow:'0 0 0 2px #fff'}}, this.initials(name));
  }

  pill(text, color, opts){
    const h=this.h; opts=opts||{};
    return h('span',{onClick:opts.onClick, style:{display:'inline-flex',alignItems:'center',gap:6,padding:opts.solid?'4px 10px':'3px 9px',borderRadius:6,fontSize:12,fontWeight:600,whiteSpace:'nowrap',cursor:opts.onClick?'pointer':'default',
      color:opts.solid?'#fff':color, background:opts.solid?color:this.hexA(color,0.12), border:opts.solid?'none':'1px solid '+this.hexA(color,0.28)}},
      opts.dot!==false && h('span',{style:{width:7,height:7,borderRadius:'50%',background:opts.solid?'rgba(255,255,255,.9)':color}}),
      text, opts.caret && h('span',{style:{fontSize:9,opacity:.7,marginLeft:2}},'▾'));
  }

    if(st.ws==='comunidades')return {t:st.community, s:'Operación por comunidad'};
    if(st.ws==='liquidacion')return {t:'Liquidación', s:'Pagos directos a comedores, comunidades y prestadores'};
    return {t:'Banca', s:'Pagos, finanzas y reportes de la cooperativa'}; }

    const h=this.h, st=this.state, T=this.wsTitle();

            style:{border:'none',outline:'none',background:'transparent',fontSize:13,width:'100%',color:'#1F2937'}}),
          (st.search||'') && h('button',{onClick:()=>this.setState({search:''}),title:'Limpiar',style:{border:'none',background:'transparent',display:'flex',padding:0,cursor:'pointer'}}, this.icon('close',14,'#9CA3AF'))),
        // notificaciones
        h('div',{style:{position:'relative'}},
          h('button',{onClick:()=>togglePanel('notif'),title:'Notificaciones',
            style:{position:'relative',width:38,height:38,borderRadius:9,border:'1px solid '+(panel==='notif'?'#5B21B6':'#E5E7EB'),background:panel==='notif'?'#EDE9FE':'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}},

          panel==='notif' && this.notifPanel()),
        // perfil
        h('div',{style:{position:'relative'}},
          h('div',{onClick:()=>togglePanel('perfil'),title:'Mi perfil',style:{display:'flex',alignItems:'center',cursor:'pointer',borderRadius:'50%',boxShadow:panel==='perfil'?'0 0 0 3px #EDE9FE':'none'}},

          h('button',{onClick:()=>togglePanel('mas'),title:'Más opciones',

  // --- Notificaciones (derivadas de datos reales) ---
  notificaciones(){
    const st=this.state, out=[];
    st.payments.filter(p=>p.status==='Vencido').forEach(p=>out.push({id:'n-'+p.id,tipo:'alert',
      txt:'Pago vencido de '+p.client+' — '+this.money(p.amount), sub:p.pkg, leida:!!st.notifLeidas[('n-'+p.id)]}));
    st.payments.filter(p=>p.status==='Pendiente').forEach(p=>out.push({id:'n-'+p.id,tipo:'clock',
      txt:'Pago pendiente de confirmar — '+this.money(p.amount), sub:p.client+' · '+p.pkg, leida:!!st.notifLeidas[('n-'+p.id)]}));
    const pend=this.liqFiltradas().filter(l=>!l.liquidado).length;
    if(pend) out.push({id:'n-liq',tipo:'receipt', txt:pend+' conceptos por liquidar', sub:'Salidas programadas', leida:!!st.notifLeidas['n-liq']});
    return out;
  }

  // --- Exportación real a CSV ---
  exportarCSV(){
    const st=this.state;
    let rows=[], nombre='export';
    if(st.ws==='ventas' && st.view==='clientes'){
      nombre='clientes';
      rows.push(['Código de tour','Cliente','Email','Teléfono','Personas','Niños','Paquete','Desde','Hasta','Precio','Método','Plataforma','% Pagado','Status']);
      this.reservasVisibles().forEach(r=>{ const p=this.pkgOf(r.pkgId);
        rows.push([r.codigo,r.name,r.email,r.phone,r.personas,r.ninos?r.numNinos:0,p?p.name:'',r.dateStart,r.dateEnd,r.price,r.payType,r.payProvider||'',r.paid+'%',r.status]); });
    } else if(st.ws==='ventas'){
      nombre='paquetes';
      rows.push(['Paquete','Duración','Comunidades','Personas','Comedores','Precio','% Pagado','Status']);
      this.paquetesVisibles().forEach(p=>rows.push([p.name,p.category,p.communities.join(' / '),this.pkgPersonas(p.id),(p.comedores||[]).length,p.price,this.pkgPaid(p.id)+'%',p.status]));
    } else if(st.ws==='liquidacion' && st.view!=='gastos'){
      nombre='liquidaciones';
      rows.push(['Salida','Concepto','Tipo','Comunidad','Día','Monto','Pago','Status']);
      this.liqFiltradas().forEach(l=>rows.push([l.pkg,l.concepto,l.tipo,l.com,l.dia||'',l.monto,l.directo?'Directo al comedor':'Cooperativa',l.liquidado?'Liquidado':'Pendiente']));
    } else if(st.ws==='banca'){
      nombre='pagos';
      rows.push(['Código','Paquete','Cliente','Monto','Fecha','Método','Plataforma','Status']);
      st.payments.forEach(p=>rows.push([p.codigo||'',p.pkg,p.client,p.amount,p.date,p.payType,p.payProvider||'',p.status]));
    } else if(st.ws==='liquidacion' && st.view==='gastos'){
      nombre='gastos';
      rows.push(['Fecha','Proveedor','Concepto','Folio','Comunidad','Paquete','Subtotal','IVA','Total','Factura']);
      st.expenses.forEach(e=>rows.push([e.fecha,e.proveedor,e.concepto,e.folio,e.community,e.pkg,e.subtotal,e.iva,e.amount,e.receipt?'Sí':'No']));
    } else {
      nombre='reporte';
      rows.push(['Concepto','Valor']);
      rows.push(['Ingresos',32500]); rows.push(['Gastos',18200]); rows.push(['Utilidad',14300]);
    }
    const csv=rows.map(r=>r.map(c=>{ const s=String(c==null?'':c); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
    try{
      const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='sierranorte-'+nombre+'.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      this.toast('Descargado: sierranorte-'+nombre+'.csv');
    }catch(err){ this.toast('No se pudo exportar','warn'); }
  }

  // --- Filtro + orden aplicados a las listas ---
  reservasVisibles(){
    const st=this.state, q=(st.search||'').toLowerCase();
    let rs=st.reservas.filter(r=>{
      const p=this.pkgOf(r.pkgId);
      if(q && !(r.name.toLowerCase().includes(q)||r.codigo.toLowerCase().includes(q)||(p&&p.name.toLowerCase().includes(q)))) return false;
      if(st.fStatus && r.status!==st.fStatus) return false;
      if(st.fPay && r.payType!==st.fPay) return false;
      if(st.fCat && (!p || p.category!==st.fCat)) return false;
      return true;
    });
    return this.ordenar(rs, r=>({name:r.name, codigo:r.codigo, personas:r.personas, price:r.price, paid:r.paid,
      fecha:(this.parseFecha(r.dateStart)||{m:99,d:99})}));
  }
  paquetesVisibles(){
    const st=this.state, q=(st.search||'').toLowerCase();
    let ps=st.packages.filter(p=>{
      if(q && !p.name.toLowerCase().includes(q)) return false;
      if(st.fStatus && p.status!==st.fStatus) return false;
      if(st.fCat && p.category!==st.fCat) return false;
      if(st.fPay) return this.pkgReservas(p.id).some(r=>r.payType===st.fPay);
      return true;
    });
    return this.ordenar(ps, p=>({name:p.name, category:p.category, price:p.price, paid:this.pkgPaid(p.id),
      fecha:(this.parseFecha(p.dateStart)||{m:99,d:99})}));
  }
  ordenar(arr, keyOf){
    const st=this.state; if(!st.sortKey) return arr;
    const dir=st.sortDir==='desc'?-1:1;
    return [...arr].sort((a,b)=>{
      const ka=keyOf(a)[st.sortKey], kb=keyOf(b)[st.sortKey];
      if(ka&&kb&&typeof ka==='object'&&'m' in ka){ const va=ka.m*100+ka.d, vb=kb.m*100+kb.d; return (va-vb)*dir; }
      if(typeof ka==='number' && typeof kb==='number') return (ka-kb)*dir;
      return String(ka||'').localeCompare(String(kb||''),'es')*dir;
    });
  }

  // ---------- MAIN ROUTER ----------
  renderMain(){
    const st=this.state;
    if(st.ws==='ventas'){
      if(st.view==='kanban')return this.renderKanban(this.ventasCards(),'status');
      if(st.view==='timeline')return this.renderTimeline();
      if(st.view==='calendario')return this.renderCalendario();
      if(st.view==='paquetes')return this.renderVentasTable();
      return this.renderClientesTable();
    }
    if(st.ws==='comunidades'){ if(st.view==='tabla')return this.renderComTable(); if(st.view==='timeline')return this.renderTimeline(); return this.renderComKanban(); }
    if(st.ws==='liquidacion'){
      if(st.view==='kanban')return this.renderLiqKanban();
      if(st.view==='tabla')return this.renderLiqTable();
      if(st.view==='gastos')return this.contabGastos();
      return this.renderLiqVentas();
    }
    // Banca absorbió Contabilidad: pagos + resumen financiero + liquidaciones + reportes
    if(st.view==='kanban')return this.renderBancaKanban();
    if(st.view==='resumen')return this.contabResumen();
    if(st.view==='liquidaciones')return this.contabLiq();
    if(st.view==='reportes')return this.contabReportes();
    return this.renderBanca();
  }

    const p=this.state.packages.find(x=>x.id===dd.id); if(!p&&['category','status','communities','actions','dates'].includes(dd.field))if(!p)return null;

  // ---------- FECHAS ----------
  get MESES(){ return ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; }
  get MESESL(){ return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; }
  parseFecha(s){
    if(!s) return null;
    const m=String(s).trim().match(/^(\d{1,2})\s*([A-Za-zÁ-úñ]{3,})?/);
    if(!m) return null;
    let mi=this.state.calMonth;
    if(m[2]){ const i=this.MESES.findIndex(x=>x.toLowerCase()===m[2].slice(0,3).toLowerCase()); if(i>=0) mi=i; }
    return {d:parseInt(m[1],10), m:mi};
  }
  // Salidas del mes visible: paquetes con fecha asignada
  salidasDelMes(){
    const {calMonth}=this.state, out=[];
    this.state.packages.forEach(p=>{
      const s=this.parseFecha(p.dateStart); if(!s) return;
      const e=this.parseFecha(p.dateEnd)||s;
      if(s.m!==calMonth && e.m!==calMonth) return;
      out.push({p, s:s.m===calMonth?s.d:1, e:e.m===calMonth?e.d:31,
                pax:this.pkgPersonas(p.id), ninos:this.pkgNinos(p.id),
                reservas:this.pkgReservas(p.id), paid:this.pkgPaid(p.id)});
    });
    return out.sort((a,b)=>a.s-b.s);
  }
  navMes(delta){ this.setState(s=>{ let m=s.calMonth+delta, y=s.calYear; if(m>11){m=0;y++;} if(m<0){m=11;y--;} return {calMonth:m, calYear:y}; }); }
  navBar(extra){
    const h=this.h, st=this.state;
    const btn=(lbl,on)=>h('button',{onClick:on,style:{width:34,height:34,borderRadius:9,border:'1px solid #E5E7EB',background:'#fff',color:'#4B5563',fontSize:16,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'},onMouseEnter:e=>e.currentTarget.style.background='#F3F4F6',onMouseLeave:e=>e.currentTarget.style.background='#fff'}, lbl);
    return h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}},
      btn('‹',()=>this.navMes(-1)),
      h('span',{style:{fontSize:17,fontWeight:800,color:'#111827',minWidth:150}}, this.MESESL[st.calMonth]+' '+st.calYear),
      btn('›',()=>this.navMes(1)),
      h('button',{onClick:()=>this.setState({calMonth:6,calYear:2026}),style:{padding:'8px 13px',borderRadius:9,border:'1px solid #E5E7EB',background:'#fff',color:'#5B21B6',fontSize:12.5,fontWeight:700}},'Hoy'),
      h('div',{style:{flex:1}}),
      extra);
  }
  leyendaDur(){
    const h=this.h;
    return h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}}, Object.keys(this.CAT).map(k=>

  // ---------- CALENDARIO ----------
  renderCalendario(){
    const h=this.h, st=this.state;
    const first=new Date(st.calYear, st.calMonth, 1);
    const nDays=new Date(st.calYear, st.calMonth+1, 0).getDate();
    const startDow=(first.getDay()+6)%7; // lunes = 0
    const bars=this.salidasDelMes();
    const hoy=(st.calMonth===6&&st.calYear===2026)?11:null;

    // eventos por día
    const porDia={};
    bars.forEach(b=>{ for(let d=b.s; d<=b.e; d++){ (porDia[d]=porDia[d]||[]).push({b, ini:d===b.s, fin:d===b.e}); } });

    const cells=[];
    for(let i=0;i<startDow;i++) cells.push(null);
    for(let d=1; d<=nDays; d++) cells.push(d);
    while(cells.length%7) cells.push(null);

    const totalPax=bars.reduce((a,b)=>a+b.pax,0);

    return h('div',{style:{padding:'18px 22px 40px',overflow:'auto',height:'100%'}},
      this.navBar(h('div',{style:{display:'flex',alignItems:'center',gap:14}},
        h('span',{style:{fontSize:12.5,fontWeight:700,color:'#6B7280'}}, bars.length+' salidas · '+totalPax+' pax'),

      h('div',{style:{border:'1px solid #E5E7EB',borderRadius:14,overflow:'hidden',background:'#fff',minWidth:900}},

            h('div',{key:d,style:{padding:'10px 12px',fontSize:11.5,fontWeight:700,textTransform:'uppercase',letterSpacing:'.03em',color:i>4?'#C4C4CC':'#6B7280',borderRight:i<6?'1px solid #EDEDF0':'none'}}, d))),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}},
          cells.map((d,i)=>{
            const evs=d?(porDia[d]||[]):[];
            const wknd=i%7>4;
            return h('div',{key:i, onClick:()=>d&&evs.length&&this.openPackageModal(evs[0].b.p),
              style:{minHeight:118,borderRight:(i%7<6)?'1px solid #F1F1F4':'none',borderBottom:'1px solid #F1F1F4',padding:8,
                background:!d?'#FBFBFC':(d===hoy?this.hexA('#5B21B6',.05):wknd?'#FCFCFD':'#fff'),
                cursor:d&&evs.length?'pointer':'default',display:'flex',flexDirection:'column',gap:4}},
              d&&h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:2}},
                h('span',{style:{fontSize:12.5,fontWeight:d===hoy?800:600,color:d===hoy?'#fff':wknd?'#C4C4CC':'#4B5563',
                  background:d===hoy?'#5B21B6':'transparent',borderRadius:'50%',width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center'}}, d),
                evs.length>0 && h('span',{style:{fontSize:10,fontWeight:800,color:'#6B7280',background:'#F3F4F6',borderRadius:20,padding:'1px 6px'}}, evs.reduce((a,e)=>a+e.b.pax,0)+' pax')),
              evs.slice(0,3).map((e,j)=>{
                const col=this.CAT[e.b.p.category];
                return h('div',{key:j,title:e.b.p.name,
                  style:{background:e.ini?col:this.hexA(col,.16), color:e.ini?'#fff':col,

  // ---------- CHECKLIST DE OPERACIÓN (dos niveles) ----------
  // Clave general del paquete:      'p01|GEN#2'
  // Clave por comunidad del paquete:'p01|Cuajimoloyas#0'
  chkVal(key, def){ const ov=this.state.checkOverrides||{}; return (key in ov) ? ov[key] : def; }
  // valor inicial determinista (demo) — al tocar el check queda guardado en checkOverrides
  chkSeed(pkgId, scope, i){ let s=0; const t=pkgId+scope; for(let k=0;k<t.length;k++) s+=t.charCodeAt(k); return (s+i*7)%3!==0; }

  // Checklist GENERAL del paquete: se confirma una sola vez para todo el tour
  chkGeneral(pkgId){
    return this.CHK_GEN.map((label,i)=>{
      const key=pkgId+'|GEN#'+i;
      return {key, label, done:this.chkVal(key, this.chkSeed(pkgId,'GEN',i))};
    });
  }
  // Checklist de UNA comunidad dentro del paquete
  chkComunidad(pkgId, com){
    return this.CHK_COM.map((label,i)=>{
      const key=pkgId+'|'+com+'#'+i;
      return {key, label, done:this.chkVal(key, this.chkSeed(pkgId,com,i))};
    });
  }
  // ¿Esta comunidad ya está lista dentro del paquete?
  comReady(pkgId, com){
    const cs=this.chkComunidad(pkgId,com), done=cs.filter(c=>c.done).length;
    return {done, total:cs.length, lista:done===cs.length, pct:Math.round(done/cs.length*100)};
  }
  // Avance del PAQUETE completo: general + todas sus comunidades
  pkgReady(p){
    const gen=this.chkGeneral(p.id);
    const coms=p.communities.map(c=>Object.assign({com:c}, this.comReady(p.id,c)));
    const done=gen.filter(c=>c.done).length + coms.reduce((a,c)=>a+c.done,0);
    const total=gen.length + coms.reduce((a,c)=>a+c.total,0);
    return {gen, coms, done, total, pct:total?Math.round(done/total*100):0,
            listas:coms.filter(c=>c.lista).length, comsTotal:coms.length};
  }
  // recibe el valor actual porque el default viene de chkSeed, no del mapa
  toggleChk(key, actual){ this.setState(s=>({checkOverrides:Object.assign({},s.checkOverrides,{[key]:!actual})})); }

  // ---------- COMUNIDADES ----------
  // Una tarjeta = el tramo de UN paquete en ESTA comunidad.
  // Si el paquete toca 3 comunidades, hay 3 tarjetas (una por comunidad),
  // pero el checklist general y el avance del paquete completo son compartidos.
  comTasks(community){
    const st=this.state;
    return st.packages.filter(p=>p.category!=='Servicios' && p.communities.includes(community)).map(p=>{
      const key=p.id+'|'+community;
      const status=st.taskStatus[key]||p.status;
      const seed=(p.id.charCodeAt(1)+p.id.charCodeAt(2)+community.length);
      const budget=[500,300,450,200,350,150,250][seed%7];
      const spent=Math.round(budget*(0.4+((seed%5)*0.12)));
      const checks=this.chkComunidad(p.id, community);
      const ready=this.comReady(p.id, community);
      const full=this.pkgReady(p);
      const guides=['Carlos Ruiz','Ana Pérez','Miguel Cruz','Lucía Nolasco','Diego Ávila','Rosa Méndez','Pablo Jiménez'];
      return {key, pkg:p, community, status, budget, spent, checks,
              pct:ready.pct, lista:ready.lista, full, guide:guides[seed%guides.length]};
    });

  pillText(s){ return 'Status: '+s; }

  // ---------- LIQUIDACIÓN ----------
  // Todo lo que se paga en campo. Los COMEDORES se liquidan DIRECTO al prestador.
  clasificarItem(it){
    const s=it.toLowerCase();
    if(/^sendero|^ruta|liquidación de sendero|^recorrido|^caminata/.test(s)) return 'Sendero';
    if(/hospedaje|caba/.test(s)) return 'Hospedaje';
    if(/taller|plantas medicinales|nixtamal/.test(s)) return 'Taller';
    if(/puente colgante|tirolesa|temazcal|acceso|museo|observación|invernadero|mirador|cueva de arroyos/.test(s)) return 'Actividad';
    return null;
  }
  liquidaciones(){
    const st=this.state, out=[];
    st.packages.forEach(p=>{
      if(p.category==='Servicios') return;
      const pax=Math.max(1,this.pkgPersonas(p.id));
      // 1) Comedores — pago DIRECTO al comedor
      (p.comedores||[]).forEach((c,i)=>out.push({
        id:p.id+'|com|'+i, pkgId:p.id, pkg:p.name, com:c.com.split('→')[0].trim(), tipo:'Comedor',
        concepto:c.tipo+' — '+c.nombre, dia:c.dia, monto:(c.monto||0)*pax, unit:c.monto||0,
        directo:true, liquidado:!!c.liquidado, ref:{kind:'comedor', pkgId:p.id, i}
      }));
      // 2) Senderos, hospedaje, actividades y talleres del itinerario
      (p.days||[]).forEach(day=>day.items.forEach((it,i)=>{
        const tipo=this.clasificarItem(it); if(!tipo) return;
        const id=p.id+'|d'+day.n+'|'+i;
        out.push({id, pkgId:p.id, pkg:p.name, com:day.com.split('→')[0].trim(), tipo,
          concepto:it, dia:day.n, monto:0, unit:0, directo:false,
          liquidado:!!st.liqPaid[id], ref:{kind:'liq', id}});
      }));
      // 3) Transporte y anfitrión bilingüe
      if(p.transporte && (p.transporte.monto||p.transporte.proveedor)){
        const id=p.id+'|transp';
        out.push({id, pkgId:p.id, pkg:p.name, com:'—', tipo:'Transporte',
          concepto:(p.transporte.tipo||'Transporte')+(p.transporte.proveedor?' — '+p.transporte.proveedor:''),
          dia:0, monto:p.transporte.monto||0, unit:p.transporte.monto||0, directo:false,
          liquidado:!!p.transporte.liquidado, ref:{kind:'transporte', pkgId:p.id}});
      }
      if(p.anfitrion && (p.anfitrion.monto||p.anfitrion.name)){
        const id=p.id+'|anf';
        out.push({id, pkgId:p.id, pkg:p.name, com:'—', tipo:'Anfitrión',
          concepto:'Anfitrión bilingüe'+(p.anfitrion.name?' — '+p.anfitrion.name:'')+' ('+(p.anfitrion.idiomas||'')+')',
          dia:0, monto:p.anfitrion.monto||0, unit:p.anfitrion.monto||0, directo:false,
          liquidado:!!p.anfitrion.liquidado, ref:{kind:'anfitrion', pkgId:p.id}});
      }
    });
    return out;
  }
  toggleLiq(item){
    const r=item.ref;
    if(r.kind==='comedor'){
      this.setState(s=>({packages:s.packages.map(p=>p.id!==r.pkgId?p:Object.assign({},p,{
        comedores:p.comedores.map((c,i)=>i===r.i?Object.assign({},c,{liquidado:!c.liquidado}):c)}))}));
    } else if(r.kind==='transporte'){
      this.setState(s=>({packages:s.packages.map(p=>p.id!==r.pkgId?p:Object.assign({},p,{transporte:Object.assign({},p.transporte,{liquidado:!p.transporte.liquidado})}))}));
    } else if(r.kind==='anfitrion'){
      this.setState(s=>({packages:s.packages.map(p=>p.id!==r.pkgId?p:Object.assign({},p,{anfitrion:Object.assign({},p.anfitrion,{liquidado:!p.anfitrion.liquidado})}))}));
    } else {
      this.setState(s=>({liqPaid:Object.assign({},s.liqPaid,{[r.id]:!s.liqPaid[r.id]})}));
    }
    this.toast(item.liquidado?'Marcado como pendiente':'Liquidado');
  }
  liqFiltradas(){
    const q=(this.state.search||'').toLowerCase();
    // sólo salidas con fecha: es lo que realmente se liquida
    const conFecha=new Set(this.state.packages.filter(p=>p.dateStart).map(p=>p.id));
    return this.liquidaciones().filter(l=>conFecha.has(l.pkgId) && (!q||l.pkg.toLowerCase().includes(q)||l.concepto.toLowerCase().includes(q)||l.com.toLowerCase().includes(q)));
  }
  // ---- Liquidación POR VENTA: detalle completo de cada salida ----
  renderLiqVentas(){
    const h=this.h, st=this.state;
    const q=(st.search||'').toLowerCase();
    const todas=this.liquidaciones();
    const salidas=st.packages.filter(p=>p.dateStart && p.category!=='Servicios')
      .filter(p=>!q||p.name.toLowerCase().includes(q))
      .map(p=>{
        const items=todas.filter(l=>l.pkgId===p.id);
        const reservas=this.pkgReservas(p.id);
        const pax=this.pkgPersonas(p.id);
        const ingreso=reservas.reduce((a,r)=>a+(r.price||0),0);
        const costo=items.reduce((a,l)=>a+l.monto,0);
        const pend=items.filter(l=>!l.liquidado);
        return {p, items, reservas, pax, ingreso, costo, pend,
                pendMonto:pend.reduce((a,l)=>a+l.monto,0),
                liqMonto:items.filter(l=>l.liquidado).reduce((a,l)=>a+l.monto,0),
                pct:items.length?Math.round((items.length-pend.length)/items.length*100):0};
      });

    const totIngreso=salidas.reduce((a,s)=>a+s.ingreso,0);

        this.field(['camera','Archivo de la factura (PDF / XML)'],
          h('div',{onClick:()=>{set({receipt:true}); this.toast('Factura adjuntada: '+(d.folio||'archivo')+'.pdf');},
            style:{border:'1.5px dashed '+(d.receipt?this.hexA('#16A34A',.5):'#D1D5DB'),borderRadius:10,padding:'20px',textAlign:'center',cursor:'pointer',
              background:d.receipt?'#F6FDF8':'#fff'}},
            h('div',{style:{display:'flex',justifyContent:'center',marginBottom:6}}, this.icon(d.receipt?'checkCircle':'up',24,d.receipt?'#16A34A':'#9CA3AF')),
            h('div',{style:{fontSize:13,fontWeight:700,color:d.receipt?'#15803D':'#6B7280'}}, d.receipt?'Factura adjuntada':'Arrastra o haz clic para subir')))));

    const footer=[this.btnGhost('Cancelar',()=>this.closeModal()), this.btnPrimary(isNew?'Registrar gasto':'Guardar cambios',()=>this.saveGasto())];
    return this.modalShell(isNew?'Nuevo gasto':(d.proveedor||'Gasto'),
      isNew?'Da de alta una factura o nota de gasto':(d.folio&&d.folio!=='—'?('Folio '+d.folio):'Sin factura'),
      body, footer, 620,
      {iconName:'wallet', color:'#FB923C',
       chip: !isNew && this.pill(d.conFactura?'Con factura':'Sin factura', d.conFactura?'#16A34A':'#9CA3AF',{dot:false})});
  }
  saveGasto(){
    const d=this.state.modal.data, isNew=this.state.modal.isNew;
    if(!d.proveedor.trim()){ this.toast('Falta el proveedor','warn'); return; }
    if(!d.concepto.trim()){ this.toast('Falta el concepto','warn'); return; }
    if(!d.subtotal){ this.toast('Falta el subtotal','warn'); return; }
    if(!d.folio) d.folio='—';
    this.setState(s=>{ const ex=s.expenses.some(e=>e.id===d.id);
      return {expenses: ex? s.expenses.map(e=>e.id===d.id?d:e) : [...s.expenses, d], modal:null}; });
    this.toast(isNew?'Gasto registrado · '+this.money(d.amount):'Gasto actualizado');
  }
  deleteGasto(id){ this.setState(s=>({expenses:s.expenses.filter(e=>e.id!==id)})); this.toast('Gasto eliminado','warn'); }

  contabGastos(){
    const h=this.h, st=this.state;
    const q=(st.search||'').toLowerCase();
    const list=st.expenses.filter(e=>!q||e.proveedor.toLowerCase().includes(q)||e.concepto.toLowerCase().includes(q)||(e.folio||'').toLowerCase().includes(q)||(e.pkg||'').toLowerCase().includes(q));
    const subtotal=list.reduce((a,b)=>a+(b.subtotal||0),0);
    const iva=list.reduce((a,b)=>a+(b.iva||0),0);
    const total=list.reduce((a,b)=>a+(b.amount||0),0);
    const conFac=list.filter(e=>e.folio&&e.folio!=='—').length;

    const cols=[['Fecha','100px'],['Proveedor','minmax(170px,1.3fr)'],['Concepto','minmax(190px,1.5fr)'],['Folio','120px'],
                ['Comunidad','150px'],['Paquete','minmax(160px,1.2fr)'],['Subtotal','110px'],['IVA','100px'],['Total','120px'],['Factura','90px'],['Acciones','110px']];
    const grid=cols.map(c=>c[1]).join(' ');
    const stickyCell={position:'sticky',right:0,zIndex:4,background:'#fff',borderRight:'none',borderLeft:'1px solid #E5E7EB',boxShadow:'-6px 0 12px -6px rgba(0,0,0,.10)',justifyContent:'center'};

    const kpi=(iconName,label,val,color)=>h('div',{style:{flex:1,minWidth:160,background:'#fff',border:'1px solid #E5E7EB',borderRadius:12,padding:'13px 15px',display:'flex',alignItems:'center',gap:11}},
      h('div',{style:{width:38,height:38,borderRadius:10,background:this.hexA(color,.12),display:'flex',alignItems:'center',justifyContent:'center',flex:'0 0 auto'}}, this.icon(iconName,18,color)),
      h('div',{style:{minWidth:0}}, h('div',{style:{fontSize:11.5,color:'#6B7280',fontWeight:600}},label), h('div',{style:{fontSize:18,fontWeight:800,color}}, val)));

    const header=h('div',{key:'h',style:{display:'grid',gridTemplateColumns:grid,position:'sticky',top:0,zIndex:7,background:'#F9FAFB',borderBottom:'1px solid #E5E7EB',height:40}},
      cols.map((c,i)=>h('div',{key:i,style:Object.assign({padding:'0 12px',display:'flex',alignItems:'center',fontSize:11.5,fontWeight:700,textTransform:'uppercase',color:'#6B7280',borderRight:'1px solid #EDEDF0'},
        c[0]==='Acciones'?{position:'sticky',right:0,zIndex:8,background:'#F9FAFB',borderRight:'none',borderLeft:'1px solid #E5E7EB',boxShadow:'-6px 0 12px -6px rgba(0,0,0,.10)',justifyContent:'center'}:{})}, c[0])));

    const cel=(child,extra,cls)=>h('div',{className:cls,style:Object.assign({padding:'0 12px',display:'flex',alignItems:'center',minWidth:0,borderRight:'1px solid #F1F1F4',height:'100%'},extra||{})}, child);

    const filas=list.map(e=>{
      const fac=e.folio&&e.folio!=='—';
      return h('div',{key:e.id, className:'tr', style:{display:'grid',gridTemplateColumns:grid,borderBottom:'1px solid #F1F1F4',height:50}},
        cel(h('span',{style:{fontSize:12.5,fontWeight:600,color:'#4B5563'}}, e.fecha||'—')),
        cel(h('span',{style:{fontSize:13,fontWeight:700,color:'#1F2937',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, e.proveedor)),
        cel(h('span',{style:{fontSize:12.5,color:'#4B5563',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, e.concepto)),
        cel(fac ? h('span',{style:{fontFamily:'ui-monospace,Menlo,monospace',fontSize:11.5,fontWeight:700,color:'#5B21B6',background:'#EDE9FE',padding:'3px 7px',borderRadius:6}}, e.folio)
                : h('span',{style:{fontSize:12,color:'#C4C4CC',fontWeight:600}},'Sin factura')),
        cel(e.community ? this.pill(e.community,this.COMM[e.community]||'#9CA3AF') : h('span',{style:{fontSize:12,color:'#C4C4CC'}},'—')),
        cel(h('span',{style:{fontSize:12.3,color:'#6B7280',fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, e.pkg||'—')),
        cel(h('span',{style:{fontSize:13,fontWeight:600,color:'#4B5563'}}, this.money(e.subtotal||0))),
        cel(h('span',{style:{fontSize:13,fontWeight:600,color:e.iva?'#4B5563':'#C4C4CC'}}, this.money(e.iva||0))),
        cel(h('span',{style:{fontSize:13.5,fontWeight:800,color:'#111827'}}, this.money(e.amount||0))),
        cel(e.receipt?this.icon('checkCircle',17,'#16A34A'):this.icon('alert',17,'#DC2626'),{justifyContent:'center'}),
        cel(h('div',{style:{display:'flex',alignItems:'center',gap:4}},
          this.actionBtn('edit','Editar gasto',()=>this.openGastoModal(e),'#5B21B6'),
          this.actionBtn('trash','Eliminar gasto',()=>this.deleteGasto(e.id),'#DC2626')), stickyCell, 'stk'));
    });

    return h('div',{style:{padding:'16px 22px 24px',height:'100%',display:'flex',flexDirection:'column',minWidth:0}},
      h('div',{style:{display:'flex',gap:12,marginBottom:14,flexWrap:'wrap',flex:'0 0 auto'}},
        kpi('note','Subtotal',this.money(subtotal),'#6B7280'),
        kpi('percent','IVA',this.money(iva),'#2563EB'),
        kpi('wallet','Total gastado',this.money(total),'#FB923C'),
        kpi('checkCircle','Con factura',conFac+' de '+list.length,'#16A34A')),
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap',flex:'0 0 auto'}},
        h('button',{onClick:()=>this.openGastoModal(null),
          style:{display:'inline-flex',alignItems:'center',gap:7,padding:'9px 15px',borderRadius:8,border:'none',background:'#5B21B6',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer',boxShadow:'0 2px 8px rgba(91,33,182,.3)'},
          onMouseEnter:ev=>ev.currentTarget.style.background='#4C1D95', onMouseLeave:ev=>ev.currentTarget.style.background='#5B21B6'},
          this.icon('plus',15,'#fff'),'Agregar gasto'),
        h('span',{style:{fontSize:12.5,color:'#9CA3AF',fontWeight:600}}, list.length+' gasto'+(list.length===1?'':'s')+' registrado'+(list.length===1?'':'s'))),
      list.length===0
        ? this.emptyState('Sin gastos registrados','Da de alta una factura con el botón Agregar gasto.')
        : this.tablaBox(1500, [header, filas,
            h('div',{key:'tot',style:{display:'grid',gridTemplateColumns:grid,borderTop:'2px solid #E5E7EB',height:48,background:'#F9FAFB',fontWeight:800}},
              cel(''),cel(''),cel(''),cel(''),cel(''),
              cel(h('span',{style:{fontSize:11.5,fontWeight:800,color:'#6B7280',textTransform:'uppercase'}},'Totales'),{justifyContent:'flex-end'}),
              cel(h('span',{style:{fontSize:13,fontWeight:800,color:'#4B5563'}}, this.money(subtotal))),
              cel(h('span',{style:{fontSize:13,fontWeight:800,color:'#2563EB'}}, this.money(iva))),
              cel(h('span',{style:{fontSize:14.5,fontWeight:800,color:'#5B21B6'}}, this.money(total))),
              cel(''), cel('', Object.assign({},stickyCell,{background:'#F9FAFB'}), 'stk'))]));
  }
  contabLiq(){
    const h=this.h;
    const rows=[['Al Corazón del Mancomún','Liquidado'],['Rutas de la Naturaleza','Pendiente'],['Sierra Norte Imperdible','Liquidado'],['Cañón del Coyote','Pendiente']];
    return h('div',{style:{padding:'16px 22px 40px',overflow:'auto',height:'100%'}},
      h('div',{style:{border:'1px solid #E5E7EB',borderRadius:12,overflow:'hidden',maxWidth:720}},
        h('div',{style:{display:'grid',gridTemplateColumns:'1.5fr 1fr 1.2fr',background:'#F9FAFB',borderBottom:'1px solid #E5E7EB',height:40}}, ['Paquete','Status','Acciones'].map(c=>h('div',{key:c,style:{padding:'0 14px',display:'flex',alignItems:'center',fontSize:11.5,fontWeight:700,textTransform:'uppercase',color:'#6B7280'}},c))),
        rows.map((r,i)=>{const done=r[1]==='Liquidado'; return h('div',{key:i,style:{display:'grid',gridTemplateColumns:'1.5fr 1fr 1.2fr',borderBottom:'1px solid #F1F1F4',height:56,alignItems:'center',background:'#fff'}},
          h('div',{style:{padding:'0 14px',fontSize:13.5,fontWeight:700}},r[0]),
          h('div',{style:{padding:'0 14px'}}, this.pill(r[1],done?'#16A34A':'#FB923C',{solid:done})),
          h('div',{style:{padding:'0 14px'}}, h('button',{onClick:()=>this.toast(done?'Abriendo reporte…':'Generando liquidación…'),style:{padding:'8px 14px',borderRadius:8,border:done?'1px solid #E5E7EB':'none',background:done?'#fff':'#5B21B6',color:done?'#4B5563':'#fff',fontSize:12.5,fontWeight:700}}, done?'Ver reporte':'Generar liquidación')));})));
  }
  contabReportes(){
    const h=this.h;
    const reps=[['Reporte mensual','PDF','pdf','#DC2626'],['Reporte por paquete','Excel','excel','#16A34A'],['Reporte por comunidad','PDF','pdf','#DC2626'],['Estado financiero trimestral','PDF','pdf','#DC2626'],['Auditoría de gastos','Excel','excel','#16A34A']];
    return h('div',{style:{padding:'18px 22px 40px',overflow:'auto',height:'100%'}},
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14,maxWidth:900}},
        reps.map((r,i)=>h('div',{key:i,onClick:()=>this.toast('Descargando '+r[0]+' ('+r[1]+')'),style:{background:'#fff',border:'1px solid #E5E7EB',borderRadius:14,padding:'18px',cursor:'pointer',display:'flex',alignItems:'center',gap:14,transition:'all .16s'},onMouseEnter:e=>{e.currentTarget.style.borderColor='#5B21B6';e.currentTarget.style.boxShadow='0 6px 18px rgba(91,33,182,.12)';},onMouseLeave:e=>{e.currentTarget.style.borderColor='#E5E7EB';e.currentTarget.style.boxShadow='none';}},
          h('div',{style:{width:46,height:46,borderRadius:11,background:this.hexA(r[3],.12),display:'flex',alignItems:'center',justifyContent:'center',flex:'0 0 auto'}}, this.icon(r[2],24,r[3])),
          h('div',{style:{flex:1}}, h('div',{style:{fontSize:14,fontWeight:700,color:'#1F2937'}},r[0]), h('div',{style:{fontSize:12,color:'#6B7280',marginTop:2}},'Descargar '+r[1])),
          this.icon('download',18,'#9CA3AF')))));
  }

  render(){ return null; }
  renderVals(){
    const h=this.h, st=this.state;
    const overlay=[];
    const dd=this.renderDropdown(); if(dd)overlay.push(h('div',{key:'ddwrap',onClick:()=>this.setState({dropdown:null}),style:{position:'fixed',inset:0,zIndex:150}},dd));
    const modal=this.renderModal(); if(modal)overlay.push(modal);
    if(st.toast)overlay.push(this.renderToast());
    const app=h('div',{onClick:()=>{ if(this.state.panel) this.setState({panel:null}); },style:{display:'flex',height:'100%',width:'100%',background:'#fff'}},
      this.renderSidebar(),
      h('div',{style:{flex:1,display:'flex',flexDirection:'column',minWidth:0,height:'100%'}},
        this.renderHeader(),
        h('div',{style:{flex:1,minHeight:0,background:'#FCFCFD',overflow:'hidden'}}, this.renderMain())),
      overlay);
    return { app };
  }
}
</script>
</body>
</html>
